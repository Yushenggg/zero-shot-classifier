# Model settings for image classification (vision-language model).

# Qwen3-VL-4B-Instruct. Any transformers-compatible multimodal checkpoint works;
# ~9 GB in bf16, so it fits a 16 GB GPU with room for the image + KV cache.
# For a reasoning variant, swap in "Qwen/Qwen3-VL-4B-Thinking" (the scorer keeps
# it in direct-answer mode via enable_thinking=False).
model = "Qwen/Qwen3-VL-4B-Instruct"

save_to = "models/qwen3-vl-4b-instruct"

# Compute device: "auto" (GPU if available, else CPU), "cpu", or "gpu"/"cuda".
device = "auto"

gpu = "rtx_5060_ti"

# bf16 where hardware-accelerated, else fp32 (e.g. Intel laptops). See config.toml.
quantize = "auto"

# Reuse one KV cache for the image + shared prompt across options (~4x faster).
# The vision prefill happens once; only the option continuation is re-run.
kv_cache = true

temperature = 1.0

calibrate = true
calibration_context = "N/A"
