[project]
name = "zero-shot"
version = "0.1.0"
description = "Zero-shot classifier using the full next-token distribution of a local language model"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "fastapi>=0.141.1",
    "huggingface-hub>=1.32.0",
    "pillow>=10.0.0",
    "pydantic>=2.0",
    "python-multipart>=0.0.9",
    "safetensors>=0.8.0",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "transformers>=5.5",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
zero-shot = "zero_shot.interfaces.cli.main:main"
zero-shot-serve = "zero_shot.interfaces.server.main:main"
zero-shot-bench = "benchmark.run:main"

[dependency-groups]
dev = ["ruff>=0.16.8,<0.17", "pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["zero_shot", "benchmark"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["zero_shot"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE", "TCH", "ANN"]

# TCH catches type-only pydantic / typing imports that should live under
# `if TYPE_CHECKING:`. ANN enforces type annotations, so pydantic model
# signatures can't silently drift from the schema.
# ANN401 disallows `typing.Any` in signatures; we keep `Any` for user-supplied
# JSON (state / questions / image blobs) — that's the correct type, not a
# shortcut.
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's File()/Form(...) in argument defaults are the documented idiom.
"zero_shot/interfaces/server/app.py" = ["B008"]
# Tests: stubs frequently lack annotations on purpose; ANN + TC003 are noisy
# there (Path is used at runtime, but `from __future__ import annotations`
# makes the rule conservatively flag it).
"tests/**/*.py" = ["ANN", "TC003"]
# `__init__.py` re-exports and protocol-like declarations; ANN is overkill.
"zero_shot/__init__.py" = ["ANN", "F401"]
"zero_shot/**/__init__.py" = ["ANN", "F401"]

[tool.ruff.lint.isort]
known-first-party = ["zero_shot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# `uv sync` installs the CUDA build of PyTorch by default (from PyPI).
# On a machine without a GPU, switch to the CPU-only build instead:
#   uv pip install --reinstall -r requirements-cpu.txt
# To restore the CUDA build afterwards:
#   uv pip install --reinstall -r requirements-gpu.txt

