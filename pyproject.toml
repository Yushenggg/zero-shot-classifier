[project]
name = "zero-shot"
version = "0.1.0"
description = "Zero-shot choice classifier using the full next-token distribution of a local Gemma model"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.15.0",
    "fastapi>=0.141.1",
    "huggingface-hub>=1.32.0",
    "safetensors>=0.8.0",
    "torch>=2.14.0",
    "transformers>=5.5",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
zero-shot = "zero_shot.cli:main"
zero-shot-serve = "zero_shot.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["zero_shot"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
