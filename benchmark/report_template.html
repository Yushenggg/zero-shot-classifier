<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>zero-shot benchmark report</title>
<style>
  :root{
    --bg:#1b1b1d; --card:#232326; --panel-2:#2c2c30; --ink:#e6e6e8; --muted:#9a9aa2;
    --border:#3a3a3f; --accent:#8ab4f8; --good:#7ee787; --mid:#e3b341; --bad:#ff7b72;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{background:var(--card);border-bottom:1px solid var(--border);padding:28px 32px}
  header h1{margin:0 0 4px;font-size:22px}
  header p{margin:0;color:var(--muted);font-size:13px}
  main{max-width:1250px;margin:0 auto;padding:24px 20px 64px}
  h2{font-size:18px;margin:28px 0 12px}
  h3{font-size:14px;margin:20px 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  h4{font-size:13px;margin:0 0 6px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 16px}
  .card .k{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
  .card .v{font-size:22px;font-weight:600;margin-top:4px}
  .card .s{font-size:12px;color:var(--muted);margin-top:2px}
  table{border-collapse:collapse;width:100%;background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden}
  th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--border);font-variant-numeric:tabular-nums}
  th:first-child,td:first-child{text-align:left}
  thead th{background:var(--panel-2);font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
  tbody tr:last-child td{border-bottom:none}
  tbody tr:hover{background:var(--panel-2)}
  td.pos{color:var(--good);font-weight:600}
  td.neg{color:var(--bad);font-weight:600}
  .dataset{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px 20px;margin-top:18px}
  .dataset h2{margin:0 0 2px}
  .dataset .meta{color:var(--muted);font-size:13px;margin-bottom:6px}
  .bars{display:grid;gap:6px;margin:10px 0 4px}
  .bar-row{display:grid;grid-template-columns:170px 1fr 130px;align-items:center;gap:10px}
  .bar-label{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bar-track{background:var(--panel-2);border-radius:6px;height:14px;overflow:hidden}
  .bar-fill{height:100%;border-radius:6px}
  .bar-fill.good{background:var(--good)} .bar-fill.mid{background:var(--mid)} .bar-fill.bad{background:var(--bad)}
  .bar-val{font-size:12px;text-align:right;font-variant-numeric:tabular-nums}
  .muted{color:var(--muted)}
  .heatmap-wrap{overflow-x:auto;margin-top:8px}
  table.heatmap{width:auto;min-width:0;border-radius:8px}
  table.heatmap th,table.heatmap td{padding:5px 8px;text-align:center;font-size:12px;border:1px solid var(--bg)}
  table.heatmap thead th{color:var(--muted)}
  table.heatmap th.corner{background:var(--panel-2);font-size:11px;text-align:left}
  table.heatmap th.total{background:var(--panel-2);color:var(--muted)}
  table.heatmap td{min-width:34px}
  .confusions{margin:8px 0 0;padding-left:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px}
  .confusions li{background:var(--panel-2);border:1px solid var(--border);border-radius:999px;padding:3px 10px;font-size:12px}
  .pill{display:inline-block;min-width:18px;text-align:center;border-radius:999px;color:#1b1b1d;font-size:11px;padding:1px 6px;margin-right:4px;font-weight:600}
  .pill.bad{background:var(--bad)}
  .run-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(430px,1fr));gap:18px;margin-top:6px}
  .run-col{min-width:0}
  .run-col h4 .tag{font-weight:400;color:var(--muted);font-size:12px;margin-left:6px}
  .legend{font-size:12px;color:var(--muted);margin-top:6px}
  .nav{margin:0 0 6px}
  .nav a{color:var(--accent);text-decoration:none;font-size:13px}
  .nav a:hover{text-decoration:underline}
  footer{max-width:1250px;margin:0 auto;padding:8px 20px 40px;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<header>
  <p class="nav"><a href="../">← zero-shot notes</a></p>
  <h1>zero-shot benchmark report</h1>
  <p id="subtitle">Generated __GENERATED_AT__</p>
</header>
<main>
  <section id="overview" class="cards"></section>

  <h2>Leaderboard</h2>
  <table id="leaderboard">
    <thead>
      <tr>
        <th>Dataset</th><th>Run</th><th>Question</th><th>N</th>
        <th>Accuracy</th><th>Macro-F1</th><th>Δ vs other</th><th>Errors</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <div id="details"></div>
</main>
<footer>Single-file report from zero-shot-bench summary.json files. No network required.</footer>
<script>
const REPORTS = __REPORT_DATA__;

const RUN_RANK = {calibrated: 0, uncalibrated: 1};
const esc = s => String(s).replace(/[&<>"']/g, c => (
  {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pct = x => x == null ? "—" : (x * 100).toFixed(1) + "%";
const num = x => x == null ? "—" : Math.round(x).toLocaleString();
const short = s => s.length > 14 ? s.slice(0, 13) + "…" : s;
const runKey = r => RUN_RANK[r] ?? 9;

function fmtDur(seconds) {
  if (seconds == null) return "—";
  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  if (h) return h + "h " + m + "m";
  const s = Math.round(seconds % 60);
  return m ? m + "m " + s + "s" : s + "s";
}

function displayNames(report) {
  const map = {};
  for (const spec of Object.values(report.questions || {})) {
    if (spec && spec.criteria && !Array.isArray(spec.criteria)) {
      for (const [key, value] of Object.entries(spec.criteria)) {
        if (value) map[key] = value;
      }
    }
  }
  return map;
}

function labelsOf(metric) {
  return metric.labels || Object.keys(metric.confusion || {});
}

function classAcc(metric, label) {
  const row = (metric.confusion || {})[label] || {};
  const total = Object.values(row).reduce((a, b) => a + b, 0);
  return total ? (row[label] || 0) / total : null;
}

function groupByDataset() {
  const groups = new Map();
  for (const report of REPORTS) {
    if (!groups.has(report.name)) groups.set(report.name, []);
    groups.get(report.name).push(report);
  }
  for (const runs of groups.values()) {
    runs.sort((a, b) => runKey(a.run) - runKey(b.run));
  }
  return groups;
}

function entryKey(dataset, question, run) {
  return dataset + "\u0000" + question + "\u0000" + run;
}

function deltaClass(delta) {
  if (delta == null) return "";
  return delta > 0.0005 ? "pos" : delta < -0.0005 ? "neg" : "";
}

function fmtDelta(delta) {
  if (delta == null) return "—";
  const pts = (delta * 100);
  const sign = pts > 0 ? "+" : "";
  return sign + pts.toFixed(1) + "pt";
}

function barsHTML(metric, names) {
  const rows = labelsOf(metric).map(label => {
    const row = (metric.confusion || {})[label] || {};
    const total = Object.values(row).reduce((a, b) => a + b, 0);
    return {label, total, acc: classAcc(metric, label)};
  });
  if (!rows.length) return '<p class="muted">No per-class data.</p>';
  return '<div class="bars">' + rows.map(r => {
    const a = r.acc == null ? 0 : r.acc;
    const cls = a >= 0.75 ? "good" : a >= 0.4 ? "mid" : "bad";
    const name = names[r.label] || r.label;
    return '<div class="bar-row">' +
      '<div class="bar-label" title="' + esc(r.label) + '">' + esc(name) + '</div>' +
      '<div class="bar-track"><div class="bar-fill ' + cls + '" style="width:' +
        (a * 100).toFixed(1) + '%"></div></div>' +
      '<div class="bar-val">' + pct(r.acc) +
        ' <span class="muted">(n=' + num(r.total) + ')</span></div>' +
      '</div>';
  }).join('') + '</div>';
}

function heatmapHTML(metric, names) {
  const labels = labelsOf(metric);
  const rows = metric.confusion || {};
  if (!labels.length) return '';
  const head = '<tr><th class="corner">gold \\ pred</th>' +
    labels.map(l => '<th title="' + esc(l) + '">' + esc(short(names[l] || l)) + '</th>').join('') +
    '<th class="total">n</th></tr>';
  const body = labels.map(gold => {
    const row = rows[gold] || {};
    const total = Object.values(row).reduce((a, b) => a + b, 0);
    const cells = labels.map(pred => {
      const count = row[pred] || 0;
      const frac = total ? count / total : 0;
      const diag = pred === gold;
      const alpha = (diag ? 0.08 + 0.42 * frac : 0.05 + 0.42 * frac).toFixed(3);
      const color = diag ? "rgba(126,231,135," + alpha + ")" : "rgba(255,123,114," + alpha + ")";
      const tip = "gold " + (names[gold] || gold) + " → pred " +
        (names[pred] || pred) + ": " + count;
      return '<td style="background:' + color + '" title="' + esc(tip) + '">' +
        (count || '') + '</td>';
    }).join('');
    return '<tr><th title="' + esc(gold) + '">' + esc(short(names[gold] || gold)) +
      '</th>' + cells + '<th class="total">' + num(total) + '</th></tr>';
  }).join('');
  return '<div class="heatmap-wrap"><table class="heatmap">' +
    '<thead>' + head + '</thead><tbody>' + body + '</tbody></table></div>';
}

function confusionsHTML(metric, names) {
  const rows = metric.confusion || {};
  const items = [];
  for (const gold of Object.keys(rows)) {
    for (const [pred, count] of Object.entries(rows[gold])) {
      if (pred !== gold && count > 0) items.push([gold, pred, count]);
    }
  }
  items.sort((a, b) => b[2] - a[2]);
  if (!items.length) return '<p class="muted">No misclassifications.</p>';
  return '<ul class="confusions">' + items.slice(0, 8).map(([g, p, c]) =>
    '<li><span class="pill bad">' + c + '</span>' +
    esc(names[g] || g) + ' → <strong>' + esc(names[p] || p) + '</strong></li>'
  ).join('') + '</ul>';
}

function allEntries() {
  const out = [];
  for (const report of REPORTS) {
    for (const [question, metric] of Object.entries(report.metrics || {})) {
      out.push({dataset: report.name, run: report.run, question, metric, report});
    }
  }
  return out;
}

function renderOverview() {
  const entries = allEntries();
  const runLabels = [...new Set(REPORTS.map(r => r.run))].sort((a, b) => runKey(a) - runKey(b));
  const examples = new Map();
  for (const report of REPORTS) {
    const prev = examples.get(report.name) || 0;
    examples.set(report.name, Math.max(prev, (report.dataset && report.dataset.examples) || 0));
  }
  const totalExamples = [...examples.values()].reduce((a, b) => a + b, 0);
  const totalEval = REPORTS.reduce((a, r) => a + ((r.timing && r.timing.eval_seconds) || 0), 0);
  const models = [...new Set(REPORTS.map(r => (r.model && r.model.id) || "?"))];

  const cards = [
    ["Datasets", REPORTS.length ? examples.size : 0],
    ["Runs", runLabels.length, runLabels.join(", ")],
    ["Examples / run", num(totalExamples)],
  ];
  for (const label of runLabels) {
    const accs = entries
      .filter(e => e.run === label && e.metric.type !== "score" && e.metric.accuracy != null)
      .map(e => e.metric.accuracy);
    const mean = accs.length ? accs.reduce((a, b) => a + b, 0) / accs.length : null;
    cards.push([label + " mean acc", mean == null ? "—" : pct(mean)]);
  }
  cards.push(["Total eval time", fmtDur(totalEval)]);

  document.getElementById("overview").innerHTML = cards.map(([k, v, s]) =>
    '<div class="card"><div class="k">' + esc(k) + '</div>' +
    '<div class="v">' + esc(v) + '</div>' +
    (s ? '<div class="s">' + esc(s) + '</div>' : '') + '</div>'
  ).join('');

  if (models.length) {
    const devices = [...new Set(REPORTS.map(r => (r.model && r.model.device) || "?"))];
    const dtypes = [...new Set(REPORTS.map(r => (r.model && r.model.dtype) || "?"))];
    document.getElementById("subtitle").textContent =
      "Generated __GENERATED_AT__ · " + models.join(", ") + " · " +
      devices.join("/") + " · " + dtypes.join("/");
  }
}

function renderLeaderboard() {
  const entries = allEntries();
  const index = new Map();
  for (const e of entries) index.set(entryKey(e.dataset, e.question, e.run), e);

  const rows = entries.slice().sort((a, b) => {
    if (a.dataset !== b.dataset) return a.dataset.localeCompare(b.dataset);
    if (a.question !== b.question) return a.question.localeCompare(b.question);
    return runKey(a.run) - runKey(b.run);
  });

  document.querySelector("#leaderboard tbody").innerHTML = rows.map(e => {
    const m = e.metric;
    const acc = m.type === "score" ? ("MAE " + (m.mae == null ? "—" : m.mae.toFixed(3))) : pct(m.accuracy);
    const f1 = m.type === "score" ? "—" : (m.macro_f1 == null ? "—" : m.macro_f1.toFixed(3));
    const n = m.n != null ? m.n : ((e.report.dataset && e.report.dataset.evaluated) || 0);
    const errs = (m.errors || 0) + (e.report.dataset ? (e.report.dataset.errors || 0) : 0);
    // Delta against the other run of the same dataset+question, when there is one.
    const peers = rows.filter(o => o.dataset === e.dataset && o.question === e.question && o.run !== e.run);
    let delta = null;
    if (peers.length === 1 && m.type !== "score" && peers[0].metric.type !== "score") {
      delta = m.accuracy - peers[0].metric.accuracy;
    }
    const dCell = delta == null ? '<td class="muted">—</td>'
      : '<td class="' + deltaClass(delta) + '">' + esc(fmtDelta(delta)) + '</td>';
    return '<tr>' +
      '<td>' + esc(e.dataset) + '</td>' +
      '<td><a href="#ds-' + esc(e.dataset) + '">' + esc(e.run) + '</a></td>' +
      '<td>' + esc(e.question) + '</td>' +
      '<td>' + num(n) + '</td>' +
      '<td><strong>' + esc(acc) + '</strong></td>' +
      '<td>' + esc(f1) + '</td>' + dCell +
      '<td>' + num(errs) + '</td></tr>';
  }).join('');
}

function comparisonTable(runs, question, names) {
  const labelSet = new Set();
  for (const run of runs) labelsOf(run.metrics[question]).forEach(l => labelSet.add(l));
  const labels = [...labelSet];
  const head = '<tr><th>class</th>' +
    runs.map(r => '<th>' + esc(r.run) + '</th>').join('') +
    (runs.length === 2 ? '<th>Δ (B−A)</th>' : '') + '</tr>';
  const body = labels.map(label => {
    const cells = runs.map(r => classAcc(r.metrics[question], label));
    const delta = cells.length === 2 && cells[0] != null && cells[1] != null
      ? cells[1] - cells[0] : null;
    return '<tr><td>' + esc(names[label] || label) + '</td>' +
      cells.map(c => '<td>' + pct(c) + '</td>').join('') +
      (runs.length === 2 ? '<td class="' + deltaClass(delta) + '">' + esc(fmtDelta(delta)) + '</td>' : '') +
      '</tr>';
  }).join('');
  return '<table>' + '<thead>' + head + '</thead><tbody>' + body + '</tbody></table>';
}

function renderDetails() {
  const groups = groupByDataset();
  const html = [...groups.entries()].map(([dataset, runs]) => {
    const names = displayNames(runs[0]);
    const model = runs[0].model || {};
    const meta = [
      (model.id || "") + (model.device ? " · " + model.device : "") +
        (model.dtype ? " · " + model.dtype : ""),
      runs.map(r => r.run + " " + fmtDur(r.timing && r.timing.eval_seconds)).join(" · "),
    ].filter(Boolean).join(" · ");

    const questions = Object.keys(runs[0].metrics || {}).map(question => {
      const first = runs[0].metrics[question];
      if (first.type === "score") {
        return '<h3>' + esc(question) + ' (score)</h3>' + comparisonTable(runs, question, names);
      }
      const perRun = runs.map(r => {
        const m = r.metrics[question];
        return '<div class="run-col"><h4>' + esc(r.run) +
          '<span class="tag">accuracy ' + pct(m.accuracy) + ' · macro-F1 ' +
          (m.macro_f1 == null ? "—" : m.macro_f1.toFixed(3)) + '</span></h4>' +
          barsHTML(m, names) +
          '<h4>Confusion matrix</h4>' + heatmapHTML(m, names) +
          '<h4>Top confusions</h4>' + confusionsHTML(m, names) + '</div>';
      }).join('');
      return '<h3>' + esc(question) + ' (' + esc(first.type) + ')</h3>' +
        comparisonTable(runs, question, names) +
        '<div class="run-grid">' + perRun + '</div>';
    }).join('');

    return '<div class="dataset" id="ds-' + esc(dataset) + '">' +
      '<h2>' + esc(dataset) + '</h2>' +
      '<div class="meta">' + esc(meta) + '</div>' + questions + '</div>';
  }).join('');
  document.getElementById("details").innerHTML = html;
}

renderOverview();
renderLeaderboard();
renderDetails();
</script>
</body>
</html>
