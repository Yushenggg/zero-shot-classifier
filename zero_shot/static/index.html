<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Zero-Shot Classifier</title>
<link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
<header>
  <h1>Zero-Shot Classifier</h1>
  <label for="type" class="example-label">Load example</label>
  <select id="type" class="example-select">
    <option value="choice">choice</option>
    <option value="noul">noul (yes/no)</option>
    <option value="score">score (scale)</option>
    <option value="mixed">mixed (all three)</option>
  </select>
  <span class="status"><span class="dot" id="dot"></span><span id="statusText">checking model…</span></span>
  <button id="themeToggle" class="theme-toggle" type="button">Light</button>
</header>

<main>
  <div class="col">
    <section class="panel">
      <h2>State / Context (JSON)</h2>
      <div id="state"></div>
    </section>

    <section class="panel">
      <h2>Questions (JSON)</h2>
      <div id="question"></div>
    </section>
  </div>

  <section class="panel" id="results">
    <h2>Result</h2>
    <div id="output"><span class="spinner">Results will appear here.</span></div>
  </section>
</main>

<footer class="runbar">
  <div class="model-id" id="modelId">…</div>
  <button id="run">Classify</button>
</footer>

<div class="modal-backdrop" id="modal">
  <div class="modal" id="modalBody"></div>
</div>

<script type="module" src="/static/js/app.js"></script>
</body>
</html>
