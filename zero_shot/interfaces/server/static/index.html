<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Zero-Shot Classifier</title>
<link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
<header>
  <h1>Zero-Shot Classifier</h1>
  <label class="mode-toggle" id="modeToggleLabel" data-mode="text">
    <span class="mode-label" data-label="text">Text</span>
    <input type="checkbox" id="modeToggle" role="switch" aria-label="Toggle image input" />
    <span class="mode-track"><span class="mode-knob"></span></span>
    <span class="mode-label" data-label="image">Image</span>
  </label>
  <label for="type" class="example-label">Load example</label>
  <select id="type" class="example-select">
    <option value="choice">choice</option>
    <option value="noul">noul (yes/no)</option>
    <option value="score">score (scale)</option>
    <option value="mixed">mixed (all three)</option>
    <option value="image">image (vision)</option>
  </select>
  <span class="status"><span class="dot" id="dot"></span><span id="statusText">checking model…</span></span>
  <button id="themeToggle" class="theme-toggle" type="button">Light</button>
</header>

<main>
  <div class="col">
    <section class="panel" id="imagePanel">
      <h2>Image</h2>
      <div class="image-row">
        <input type="file" id="imageInput" accept="image/*" />
        <button id="imageClear" class="ghost" type="button">Clear</button>
      </div>
      <div class="image-note" id="imageNote">Attach an image to classify it with a vision-language model.</div>
      <details class="image-state" id="imageStateDetails">
        <summary>Add text context (optional)</summary>
        <textarea id="imageState" class="image-state-input" placeholder='{ "input": "extra context the image alone does not carry" }' spellcheck="false"></textarea>
      </details>
      <img id="imagePreview" class="image-preview" alt="" hidden />
    </section>

    <section class="panel" id="statePanel">
      <h2>State / Context (JSON)</h2>
      <div id="state"></div>
    </section>

    <section class="panel">
      <h2>Questions (JSON)</h2>
      <div id="question"></div>
    </section>
  </div>

  <section class="panel" id="results">
    <h2>Result</h2>
    <div id="output"><span class="spinner">Results will appear here.</span></div>
  </section>
</main>

<footer class="runbar">
  <div class="model-id" id="modelId">…</div>
  <button id="run">Classify</button>
</footer>

<div class="modal-backdrop" id="modal">
  <div class="modal" id="modalBody"></div>
</div>

<script type="module" src="/static/js/app.js"></script>
</body>
</html>
