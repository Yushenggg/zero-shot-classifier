# CPU + vision config for the zero-shot classifier.
#
# Serve with:
#   zero-shot-serve --cpu-low    # auto-discovers this file
#   zero-shot-serve --config config.cpu.toml
#
# SmolVLM-500M-Instruct is a small Idefics3 vision-language model (~500M params,
# ~1 GB bf16, ~2 GB fp32). It runs comfortably in fp32 on a CPU-only laptop, so
# no quantization is needed. Architecture is native to transformers (no
# trust_remote_code needed). Quality is below Qwen3-VL-4B (see the
# criteria-order bias table in the README); the trade-off is universal CPU
# availability.

model = "HuggingFaceTB/SmolVLM-500M-Instruct"
save_to = "models/smolvlm-500m-instruct"

# Force CPU: this config is for machines without a usable GPU.
device = "cpu"

# Kept for compatibility with `gpu = "..."` validation; unused on CPU.
gpu = "rtx_5060_ti"

# fp32 keeps the logprobs exact: with the KV cache on, the cached path is
# identical to the exact path. It also avoids PyTorch's slow emulated bf16 on
# mobile/consumer Intel chips (12th gen+, where AVX-512_BF16 is fused off).
# int8 dynamic quantization (~2x faster on AVX2+VNNI, ~0.5 GB) is available as
# an opt-in for very RAM-constrained or slow machines, but it perturbs logprobs
# (near-tie predictions can shift), so it is not the default.
quantize = "fp32"

kv_cache = true

temperature = 1.0

calibrate = true
calibration_context = "N/A"
