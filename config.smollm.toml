# Model settings for the zero-shot classifier (SmolLM2-360M on CPU).

model = "HuggingFaceTB/SmolLM2-360M-Instruct"
save_to = "models/smollm2-360m-instruct"

device = "cpu"

gpu = "rtx_5060_ti"

# bf16 where hardware-accelerated, else fp32 (e.g. Intel laptops). See config.toml.
quantize = "auto"

kv_cache = true

temperature = 1.0

calibrate = true
calibration_context = "N/A"
