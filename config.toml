# Model settings for the zero-shot classifier.

# Hugging Face model id (or a local directory path).
model = "Qwen/Qwen3-4B-Instruct-2507"

# Directory to download and load the model from. Once populated, the model is
# loaded from disk and Hugging Face is not contacted again.
# Relative paths are resolved from this project directory.
# Set to "" to use the default Hugging Face cache instead.
save_to = "models/qwen3-4b-instruct-2507"

# Compute device: "auto" (GPU if available, else CPU), "cpu", or "gpu"/"cuda".
# `uv sync` installs the CUDA build by default; switch to CPU with
#   uv pip install --reinstall -r requirements-cpu.txt
device = "auto"

# Which GPU to run on when device = "gpu". Supported: "rtx_5060_ti".
gpu = "rtx_5060_ti"

# Reuse one KV cache for the shared prompt across options (~4x faster).
# On by default. Approximate: uses the cached attention path, so rare near-tie
# tokens can shift. If a model can't reuse its cache, the scorer falls back to
# exact scoring and logs a warning. Set false to always use the exact path.
kv_cache = true
